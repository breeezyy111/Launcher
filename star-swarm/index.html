<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Star Swarm</title>
<style>
  [hidden] { display:none !important; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:#03040c; overflow:hidden; touch-action:none; }
  canvas { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const cv = document.getElementById('c'), x = cv.getContext('2d');
  const W = 480, H = 760;
  let scale = 1, ox = 0, oy = 0;
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    scale = Math.min(innerWidth / W, innerHeight / H) * dpr;
    ox = (cv.width - W * scale) / 2; oy = (cv.height - H * scale) / 2;
  }
  addEventListener('resize', resize); resize();

  const BEST_KEY = 'star-swarm:best';
  let best = +localStorage.getItem(BEST_KEY) || 0;
  const stars = [...Array(90)].map(() => ({ x: Math.random() * W, y: Math.random() * H, z: Math.random() * 2 + .4 }));
  let state = 'title', score, wave, ship, bullets, foes, ebullets, drops, fx, waveT, banner;

  function newGame() {
    score = 0; wave = 0;
    ship = { x: W / 2, y: H - 90, tx: W / 2, ty: H - 90, hp: 3, inv: 0, cd: 0, gun: 1, rapid: 0, shield: 0 };
    bullets = []; foes = []; ebullets = []; drops = []; fx = [];
    nextWave(); state = 'play';
  }

  // Waves: enemies fly in on curves, hold a formation, and dive at you. Every 5th wave is a boss.
  function nextWave() {
    wave++; waveT = 0; banner = 120;
    if (wave % 5 === 0) {
      foes.push({ k: 'boss', x: W / 2, y: -80, hx: W / 2, hy: 150, hp: 60 + wave * 12, max: 60 + wave * 12, r: 46, t: 0, cd: 60 });
      return;
    }
    const n = Math.min(8 + wave * 2, 28);
    const cols = 7;
    for (let i = 0; i < n; i++) {
      const c = i % cols, r = Math.floor(i / cols);
      const k = r === 0 && wave > 2 ? 'gunner' : r % 2 ? 'darter' : 'drone';
      const fromLeft = i % 2 === 0;
      foes.push({ k, hx: 60 + c * 60, hy: 110 + r * 52, x: fromLeft ? -40 : W + 40, y: 120 + Math.random() * 200, t: -i * 8,
        hp: k === 'gunner' ? 3 : 1, r: 16, dive: 0, cd: 90 + Math.random() * 200, phase: Math.random() * 6 });
    }
  }

  // ---- input ----
  const keys = {};
  addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault(); if (e.key === ' ' || e.key === 'Enter') start(); if (e.key === 'p' || e.key === 'Escape') state = state === 'play' ? 'paused' : state === 'paused' ? 'play' : state; });
  addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
  let drag = null;
  const pt = (e) => [(e.clientX * cv.width / innerWidth - ox) / scale, (e.clientY * cv.height / innerHeight - oy) / scale];
  cv.addEventListener('pointerdown', (e) => { if (state !== 'play') return start(); const [px, py] = pt(e); drag = { px, py, sx: ship.tx, sy: ship.ty }; });
  // Relative drag: your finger never covers the ship.
  cv.addEventListener('pointermove', (e) => { if (!drag || state !== 'play') return; const [px, py] = pt(e); ship.tx = drag.sx + (px - drag.px) * 1.3; ship.ty = drag.sy + (py - drag.py) * 1.3; });
  addEventListener('pointerup', () => { drag = null; });
  addEventListener('blur', () => { if (state === 'play') state = 'paused'; });
  function start() { if (state === 'title' || state === 'over') newGame(); else if (state === 'paused') state = 'play'; }

  function boom(px, py, col, n = 14, sp = 4) { for (let i = 0; i < n; i++) { const a = Math.random() * 7, v = Math.random() * sp; fx.push({ x: px, y: py, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 26 + Math.random() * 14, col }); } }

  let padBtn = false;
  function update() {
    for (const s of stars) { s.y += s.z * (state === 'play' ? 1.6 : .6); if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
    const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
    let gx = 0, gy = 0, btn = false;
    for (const g of pads) { if (Math.abs(g.axes[0]) > .2) gx = g.axes[0]; if (Math.abs(g.axes[1]) > .2) gy = g.axes[1]; if (g.buttons[0]?.pressed || g.buttons[9]?.pressed) btn = true; }
    if (btn && !padBtn && state !== 'play') start();
    padBtn = btn;
    if (state !== 'play') return;
    const kx = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0) + gx;
    const ky = (keys.arrowdown || keys.s ? 1 : 0) - (keys.arrowup || keys.w ? 1 : 0) + gy;
    if (kx || ky) { ship.tx = ship.x + kx * 7; ship.ty = ship.y + ky * 7; }
    ship.tx = Math.max(20, Math.min(W - 20, ship.tx)); ship.ty = Math.max(H * .45, Math.min(H - 40, ship.ty));
    ship.x += (ship.tx - ship.x) * .35; ship.y += (ship.ty - ship.y) * .35;
    ship.inv--; ship.rapid--; ship.shield--;
    // auto-fire
    if (--ship.cd <= 0) {
      ship.cd = ship.rapid > 0 ? 5 : 9;
      const spread = [[0], [-6, 6], [-10, 0, 10], [-14, -5, 5, 14]][Math.min(ship.gun, 4) - 1];
      for (const dx of spread) bullets.push({ x: ship.x + dx, y: ship.y - 18, vx: dx * .05, vy: -12 });
    }
    for (const b of bullets) { b.x += b.vx; b.y += b.vy; }
    bullets = bullets.filter((b) => b.y > -20);

    waveT++;
    for (const f of foes) {
      f.t++;
      if (f.k === 'boss') {
        f.x += (f.hx + Math.sin(f.t / 70) * 140 - f.x) * .03; f.y += (f.hy - f.y) * .03;
        if (--f.cd <= 0) {
          f.cd = f.hp < f.max / 2 ? 34 : 50;
          const n = 10 + (wave / 5) * 2;
          for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2 + f.t / 30; ebullets.push({ x: f.x, y: f.y, vx: Math.cos(a) * 2.6, vy: Math.sin(a) * 2.6 + 1 }); }
        }
        continue;
      }
      if (f.t < 0) continue;
      if (f.dive) {
        f.dive++;
        f.y += 3.2 + wave * .12; f.x += Math.sin(f.dive / 14 + f.phase) * 3 + (ship.x - f.x) * .008;
        if (f.y > H + 30) { f.y = -30; f.dive = 0; }
      } else {
        const ease = Math.min(1, f.t / 70);
        const hx = f.hx + Math.sin(waveT / 50) * 26;
        f.x += (hx - f.x) * (.04 + ease * .1); f.y += (f.hy - f.y) * (.04 + ease * .1);
        if (f.t > 140 && Math.random() < .0015 * (1 + wave * .3) && f.k !== 'gunner') f.dive = 1;
      }
      if (--f.cd <= 0 && f.y > 0 && f.t > 60) {
        f.cd = (f.k === 'gunner' ? 80 : 160) + Math.random() * 120 - wave * 4;
        const a = Math.atan2(ship.y - f.y, ship.x - f.x), v = 3 + wave * .08;
        ebullets.push({ x: f.x, y: f.y + 10, vx: Math.cos(a) * v, vy: Math.sin(a) * v });
      }
    }
    // hits on enemies
    for (const b of bullets) for (const f of foes) {
      if (f.hp > 0 && Math.hypot(b.x - f.x, b.y - f.y) < f.r + 4) {
        f.hp--; fx.push({ x: b.x, y: b.y, vx: 0, vy: 0, t: 6, col: '#fff' }); b.y = -99;
        if (f.hp <= 0) {
          const pts = { drone: 100, darter: 150, gunner: 250, boss: 5000 }[f.k] * (f.dive ? 2 : 1);
          score += pts; boom(f.x, f.y, f.k === 'boss' ? '#ffcc4d' : COL[f.k], f.k === 'boss' ? 80 : 16, f.k === 'boss' ? 8 : 4);
          if (Math.random() < (f.k === 'boss' ? 1 : .07)) drops.push({ x: f.x, y: f.y, k: ['gun', 'rapid', 'shield', 'hp'][Math.floor(Math.random() * 4)] });
        }
        break;
      }
    }
    foes = foes.filter((f) => f.hp > 0);
    // hits on you
    const hurt = () => {
      if (ship.inv > 0) return;
      if (ship.shield > 0) { ship.shield = 0; ship.inv = 60; boom(ship.x, ship.y, '#4dd9ff', 20); return; }
      ship.hp--; ship.inv = 120; ship.gun = Math.max(1, ship.gun - 1); boom(ship.x, ship.y, '#ff5d8f', 30, 5); navigator.vibrate?.(100);
      if (ship.hp <= 0) { state = 'over'; if (score > best) { best = score; localStorage.setItem(BEST_KEY, best); } }
    };
    for (const e of ebullets) { e.x += e.vx; e.y += e.vy; if (Math.hypot(e.x - ship.x, e.y - ship.y) < 10) { e.y = H + 99; hurt(); } }
    ebullets = ebullets.filter((e) => e.y < H + 20 && e.y > -20 && e.x > -20 && e.x < W + 20);
    for (const f of foes) if (f.k !== 'boss' && Math.hypot(f.x - ship.x, f.y - ship.y) < f.r + 10) { f.hp = 0; boom(f.x, f.y, COL[f.k]); hurt(); }
    for (const d of drops) { d.y += 2; if (Math.hypot(d.x - ship.x, d.y - ship.y) < 26) { d.y = H + 99; score += 200;
      if (d.k === 'gun') ship.gun = Math.min(4, ship.gun + 1); if (d.k === 'rapid') ship.rapid = 600; if (d.k === 'shield') ship.shield = 900; if (d.k === 'hp') ship.hp = Math.min(5, ship.hp + 1); } }
    drops = drops.filter((d) => d.y < H + 20);
    for (const p of fx) { p.x += p.vx; p.y += p.vy; p.vx *= .96; p.vy *= .96; p.t--; }
    fx = fx.filter((p) => p.t > 0);
    if (banner > 0) banner--;
    if (!foes.length && state === 'play') nextWave();
  }

  const COL = { drone: '#6bff95', darter: '#ff5d8f', gunner: '#ffcc4d', boss: '#b47bff' };
  function drawShip(px, py) {
    x.save(); x.translate(px, py);
    x.fillStyle = '#ff9f43'; x.globalAlpha = .6 + Math.random() * .4;
    x.beginPath(); x.moveTo(-6, 14); x.lineTo(0, 24 + Math.random() * 8); x.lineTo(6, 14); x.fill(); x.globalAlpha = 1;
    x.fillStyle = '#e8eeff'; x.shadowColor = '#4dd9ff'; x.shadowBlur = 16;
    x.beginPath(); x.moveTo(0, -20); x.lineTo(16, 14); x.lineTo(5, 9); x.lineTo(0, 14); x.lineTo(-5, 9); x.lineTo(-16, 14); x.closePath(); x.fill();
    x.shadowBlur = 0; x.fillStyle = '#4dd9ff'; x.beginPath(); x.ellipse(0, -2, 4, 7, 0, 0, 7); x.fill();
    x.restore();
  }
  function drawFoe(f) {
    x.save(); x.translate(f.x, f.y); const c = COL[f.k]; x.fillStyle = c; x.shadowColor = c; x.shadowBlur = 14;
    if (f.k === 'drone') { x.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + f.t / 30; x.lineTo(Math.cos(a) * 14, Math.sin(a) * 14); } x.fill(); x.fillStyle = '#03040c'; x.beginPath(); x.arc(0, 0, 5, 0, 7); x.fill(); }
    if (f.k === 'darter') { x.rotate(f.dive ? Math.PI : 0); x.beginPath(); x.moveTo(0, 16); x.lineTo(14, -12); x.lineTo(0, -4); x.lineTo(-14, -12); x.closePath(); x.fill(); }
    if (f.k === 'gunner') { x.beginPath(); x.roundRect(-16, -12, 32, 24, 8); x.fill(); x.fillStyle = '#03040c'; x.fillRect(-10, -2, 20, 4); x.fillStyle = c; x.fillRect(-3, 10, 6, 8); }
    if (f.k === 'boss') {
      const p = 1 + Math.sin(f.t / 10) * .04; x.scale(p, p);
      x.beginPath(); for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, r = i % 2 ? 34 : 50; x.lineTo(Math.cos(a) * r, Math.sin(a) * r); } x.fill();
      x.fillStyle = '#03040c'; x.beginPath(); x.arc(0, 0, 18, 0, 7); x.fill(); x.fillStyle = '#ff5d8f'; x.beginPath(); x.arc(Math.sin(f.t / 20) * 6, 0, 8, 0, 7); x.fill();
    }
    x.restore();
  }

  function draw() {
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = '#03040c'; x.fillRect(0, 0, cv.width, cv.height);
    x.setTransform(scale, 0, 0, scale, ox, oy);
    x.save(); x.beginPath(); x.rect(0, 0, W, H); x.clip();
    const g = x.createRadialGradient(W * .7, H * .2, 10, W * .7, H * .2, 500); g.addColorStop(0, '#1d1240'); g.addColorStop(1, '#05061a');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    for (const s of stars) { x.fillStyle = `rgba(200,210,255,${s.z / 2.6})`; x.fillRect(s.x, s.y, s.z, s.z * (state === 'play' ? 3 : 1)); }
    if (state === 'title') { overlay('STAR SWARM', 'Tap or press Space to launch', `Best ${best.toLocaleString()}`); x.restore(); return; }
    for (const d of drops) { const c = { gun: '#ffcc4d', rapid: '#ff9f43', shield: '#4dd9ff', hp: '#ff5d8f' }[d.k]; x.strokeStyle = c; x.lineWidth = 3; x.shadowColor = c; x.shadowBlur = 12; x.beginPath(); x.arc(d.x, d.y, 11, 0, 7); x.stroke(); x.shadowBlur = 0; x.fillStyle = c; x.font = '800 12px system-ui'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText({ gun: 'G', rapid: 'R', shield: 'S', hp: '♥' }[d.k], d.x, d.y + 1); }
    for (const f of foes) drawFoe(f);
    x.fillStyle = '#9ff3ff'; for (const b of bullets) x.fillRect(b.x - 1.5, b.y - 8, 3, 12);
    x.fillStyle = '#ff7aa8'; for (const e of ebullets) { x.beginPath(); x.arc(e.x, e.y, 4, 0, 7); x.fill(); }
    if (state !== 'over' && (ship.inv <= 0 || (ship.inv >> 2) % 2)) drawShip(ship.x, ship.y);
    if (ship.shield > 0 && state !== 'over') { x.strokeStyle = '#4dd9ff88'; x.lineWidth = 2; x.beginPath(); x.arc(ship.x, ship.y, 26, 0, 7); x.stroke(); }
    for (const p of fx) { x.globalAlpha = Math.min(1, p.t / 20); x.fillStyle = p.col; x.fillRect(p.x - 2, p.y - 2, 4, 4); }
    x.globalAlpha = 1;
    const boss = foes.find((f) => f.k === 'boss');
    if (boss) { x.fillStyle = '#ffffff22'; x.fillRect(60, 48, W - 120, 6); x.fillStyle = '#b47bff'; x.fillRect(60, 48, (W - 120) * boss.hp / boss.max, 6); }
    x.fillStyle = '#fff'; x.font = '700 18px system-ui'; x.textBaseline = 'middle'; x.textAlign = 'left'; x.fillText(score.toLocaleString(), 16, 24);
    x.textAlign = 'right'; x.fillStyle = '#ff7aa8'; x.fillText('♥'.repeat(Math.max(ship.hp, 0)), W - 16, 24);
    x.textAlign = 'center'; x.fillStyle = '#9aa3d8'; x.font = '600 14px system-ui'; x.fillText(`WAVE ${wave}`, W / 2, 24);
    if (banner > 0 && state === 'play') { x.globalAlpha = Math.min(1, banner / 30); x.fillStyle = '#fff'; x.font = '900 34px system-ui'; x.fillText(wave % 5 === 0 ? 'BOSS INCOMING' : `WAVE ${wave}`, W / 2, H / 2); x.globalAlpha = 1; }
    if (state === 'paused') overlay('PAUSED', 'Tap or press Space to keep going');
    if (state === 'over') overlay('SHIP DOWN', 'Tap or Space to fly again', `Score ${score.toLocaleString()}  ·  Best ${best.toLocaleString()}`);
    x.restore();
  }
  function overlay(t, s, s2) {
    x.fillStyle = '#03040ccc'; x.fillRect(0, 0, W, H);
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff'; x.font = '900 44px system-ui'; x.shadowColor = '#b47bff'; x.shadowBlur = 26;
    x.fillText(t, W / 2, H / 2 - 40); x.shadowBlur = 0;
    x.font = '600 17px system-ui'; x.fillStyle = '#cfd6ff'; x.fillText(s, W / 2, H / 2 + 6);
    if (s2) { x.fillStyle = '#ffcc4d'; x.fillText(s2, W / 2, H / 2 + 36); }
    if (t === 'STAR SWARM') { x.fillStyle = '#8890c0'; x.font = '500 14px system-ui'; x.fillText('Move: drag, arrows/WASD or a gamepad. Firing is automatic.', W / 2, H / 2 + 90); x.fillText('Pick-ups: G more guns · R rapid fire · S shield · ♥ repair', W / 2, H / 2 + 112); }
  }

  let last = 0, acc = 0;
  function loop(t) { acc += Math.min(100, t - last); last = t; while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; } draw(); requestAnimationFrame(loop); }
  requestAnimationFrame((t) => { last = t; loop(t); });
})();
</script>
</body>
</html>
