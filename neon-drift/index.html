<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Neon Drift</title>
<style>
  :root { --bg:#07060f; --fg:#f4f2ff; --muted:#9c97c2; --a:#22d3ee; --b:#f472b6; --c:#facc15; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { display:block; width:100%; height:100%; }
  .hud { position:fixed; top:14px; left:16px; right:16px; display:flex; justify-content:space-between; pointer-events:none; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  .hud small { display:block; font-size:11px; color:var(--muted); letter-spacing:.12em; text-transform:uppercase; font-weight:600; }
  .hud .v { font-size:22px; }
  .overlay { position:fixed; inset:0; display:grid; place-items:center; background:radial-gradient(circle at 50% 40%, #1b1240cc, #07060fee); }
  .overlay[hidden] { display:none; }
  .panel { text-align:center; padding:24px; max-width:360px; }
  h1 { font-size:clamp(40px,10vw,64px); line-height:1; letter-spacing:-.03em; background:linear-gradient(90deg,var(--a),var(--b)); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 18px #22d3ee55); }
  p { color:var(--muted); margin:14px 0 22px; line-height:1.5; }
  button { font:inherit; font-weight:700; font-size:17px; color:#07060f; background:linear-gradient(90deg,var(--a),var(--b)); border:0; border-radius:999px; padding:14px 34px; cursor:pointer; box-shadow:0 0 28px #f472b655; }
  button:focus-visible { outline:3px solid #fff; outline-offset:3px; }
  .final { font-size:15px; color:var(--fg); margin-bottom:6px; }
  kbd { font:inherit; font-size:12px; border:1px solid #ffffff33; border-radius:6px; padding:1px 6px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div><small>Score</small><span class="v" id="score">0</span></div><div style="text-align:right"><small>Best</small><span class="v" id="best">0</span></div></div>
<div class="overlay" id="menu">
  <div class="panel">
    <h1>Neon Drift</h1>
    <p id="msg">Steer through the neon storm. Grab the yellow orbs for bonus points.<br>Drag, move the mouse, or use <kbd>←</kbd> <kbd>→</kbd>.</p>
    <div class="final" id="final" hidden></div>
    <button id="go">Play</button>
  </div>
</div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $score = document.getElementById('score'), $best = document.getElementById('best');
  const menu = document.getElementById('menu'), go = document.getElementById('go'), final = document.getElementById('final'), msg = document.getElementById('msg');
  let W = 0, H = 0, dpr = 1;
  const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
  let best = +store.get('neon-drift-best') || 0; $best.textContent = best;

  function resize(){ dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  addEventListener('resize', resize); resize();

  const stars = Array.from({length:120}, () => ({ x:Math.random(), y:Math.random(), z:Math.random()*0.8+0.2 }));
  let state = 'menu', player, rocks, orbs, parts, score, t, speed, spawnT, orbT, targetX, keys = {}, last = 0, shake = 0;

  function reset(){
    player = { x:W/2, y:H-90, r:14, vx:0 }; targetX = null;
    rocks = []; orbs = []; parts = []; score = 0; t = 0; speed = 220; spawnT = 0; orbT = 2;
  }
  function start(){ reset(); state = 'play'; menu.hidden = true; }
  go.addEventListener('click', start);
  addEventListener('keydown', e => { keys[e.key] = true; if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') { e.preventDefault(); start(); } });
  addEventListener('keyup', e => { keys[e.key] = false; });
  const point = e => { if (state === 'play') targetX = e.clientX; };
  cv.addEventListener('pointermove', point); cv.addEventListener('pointerdown', point);

  function burst(x,y,col,n){ for (let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=60+Math.random()*260; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6+Math.random()*.5,col}); } }

  function die(){
    state = 'over'; shake = 18; burst(player.x, player.y, '#f472b6', 70);
    const s = Math.floor(score);
    if (s > best) { best = s; store.set('neon-drift-best', best); $best.textContent = best; }
    setTimeout(() => { final.hidden = false; final.textContent = s >= best && s > 0 ? `New best: ${s}!` : `Score ${s} · Best ${best}`; msg.hidden = true; go.textContent = 'Play again'; menu.hidden = false; go.focus(); }, 700);
  }

  function update(dt){
    for (const s of stars) { s.y += dt * s.z * (speed/900); if (s.y > 1) { s.y = 0; s.x = Math.random(); } }
    parts = parts.filter(p => (p.life -= dt) > 0); for (const p of parts) { p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= .96; p.vy *= .96; }
    shake = Math.max(0, shake - dt*40);
    if (state !== 'play') return;
    t += dt; speed = 220 + t*9; score += dt * speed / 20;
    // steering
    const k = (keys.ArrowLeft||keys.a ? -1 : 0) + (keys.ArrowRight||keys.d ? 1 : 0);
    if (k) { targetX = null; player.vx += k * 2600 * dt; }
    else if (targetX != null) player.vx += (targetX - player.x) * 30 * dt;
    player.vx *= Math.pow(0.0009, dt); player.x += player.vx * dt;
    player.x = Math.max(player.r, Math.min(W - player.r, player.x)); player.y = H - Math.max(80, H*0.12);
    // spawns
    spawnT -= dt; if (spawnT <= 0) { spawnT = Math.max(0.16, 0.7 - t*0.012) * (0.6 + Math.random()*0.8); const r = 10 + Math.random()*22; rocks.push({x:Math.random()*W, y:-r, r, rot:Math.random()*6, vr:(Math.random()-.5)*4, vy:speed*(0.8+Math.random()*0.5), sides:3+Math.floor(Math.random()*3)}); }
    orbT -= dt; if (orbT <= 0) { orbT = 2.5 + Math.random()*3; orbs.push({x:20+Math.random()*(W-40), y:-12, r:9, vy:speed*0.9}); }
    for (const r of rocks) { r.y += r.vy*dt; r.rot += r.vr*dt; if (Math.hypot(r.x-player.x, r.y-player.y) < r.r*0.82 + player.r*0.7) { die(); break; } }
    rocks = rocks.filter(r => r.y < H + 40);
    for (const o of orbs) if (!o.got) { o.y += o.vy*dt; if (Math.hypot(o.x-player.x, o.y-player.y) < o.r + player.r) { o.got = true; score += 50; burst(o.x,o.y,'#facc15',24); } }
    orbs = orbs.filter(o => !o.got && o.y < H + 20);
    if (Math.random() < dt*40) parts.push({x:player.x+(Math.random()-.5)*8, y:player.y+16, vx:(Math.random()-.5)*30, vy:120+Math.random()*80, life:.35, col:'#22d3ee'});
    $score.textContent = Math.floor(score);
  }

  function poly(x,y,r,n,rot){ ctx.beginPath(); for (let i=0;i<n;i++){ const a=rot+i*Math.PI*2/n; ctx.lineTo(x+Math.cos(a)*r, y+Math.sin(a)*r); } ctx.closePath(); }

  function draw(){
    ctx.save();
    if (shake) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);
    const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0b0820'); g.addColorStop(1,'#16082a'); ctx.fillStyle = g; ctx.fillRect(-20,-20,W+40,H+40);
    // grid floor
    ctx.strokeStyle = '#f472b622'; ctx.lineWidth = 1; const off = (t*speed*0.25) % 40;
    for (let y = H*0.55 + off; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    for (const s of stars) { ctx.fillStyle = `rgba(255,255,255,${s.z*0.8})`; ctx.fillRect(s.x*W, s.y*H, s.z*2, s.z*2 + speed*s.z/300); }
    ctx.globalCompositeOperation = 'lighter';
    for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life*2); ctx.fillStyle = p.col; ctx.fillRect(p.x-1.5,p.y-1.5,3,3); }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 18;
    for (const r of rocks) { ctx.shadowColor = '#f472b6'; ctx.strokeStyle = '#f472b6'; ctx.lineWidth = 2.5; poly(r.x,r.y,r.r,r.sides,r.rot); ctx.stroke(); ctx.fillStyle = '#f472b61f'; ctx.fill(); }
    for (const o of orbs) { ctx.shadowColor = '#facc15'; ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(o.x,o.y,o.r*(0.85+0.15*Math.sin(t*10)),0,Math.PI*2); ctx.fill(); }
    if (state === 'play') { const p = player, tilt = Math.max(-.5, Math.min(.5, p.vx/900)); ctx.shadowColor = '#22d3ee'; ctx.strokeStyle = '#22d3ee'; ctx.fillStyle = '#22d3ee33'; ctx.lineWidth = 3;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(tilt); ctx.beginPath(); ctx.moveTo(0,-p.r*1.4); ctx.lineTo(p.r,p.r); ctx.lineTo(0,p.r*0.5); ctx.lineTo(-p.r,p.r); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
    ctx.restore(); ctx.shadowBlur = 0; ctx.globalCompositeOperation = 'source-over';
  }

  function loop(now){ const dt = Math.min(0.033, (now - last)/1000 || 0); last = now; update(dt); draw(); requestAnimationFrame(loop); }
  reset(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
