<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hex Arena</title>
</head>
<body>
<script src="../kit/kit.js"></script>
<script>
(() => {
  const K = window.K.init({ id: 'hex-arena', W: 600, H: 600, bg: '#07070f', accent: '#5cffb0', fit: 'grow' });
  const c = K.ctx;
  let me, foes, bullets, ebul, drops, wave, score, waveT, spawnLeft, mouse, power, combo, comboT;
  function reset() {
    me = { x: K.W / 2, y: K.H / 2, hp: 5, inv: 0, cd: 0, ang: 0 }; foes = []; bullets = []; ebul = []; drops = []; wave = 0; score = 0; waveT = 60; spawnLeft = 0; power = { rapid: 0, spread: 0 }; combo = 1; comboT = 0;
    K.clearParts();
  }
  const TYPES = {
    chaser: { hp: 1, sp: 1.6, r: 13, col: '#ff5c8a', pts: 10, sides: 3 },
    dasher: { hp: 2, sp: 1, r: 14, col: '#ffb547', pts: 20, sides: 4 },
    splitter: { hp: 4, sp: .9, r: 20, col: '#b58cff', pts: 30, sides: 6 },
    shooter: { hp: 3, sp: .7, r: 16, col: '#4dc3ff', pts: 30, sides: 5 },
    mini: { hp: 1, sp: 2.2, r: 8, col: '#d7c2ff', pts: 5, sides: 6 },
  };
  function spawn(k, x, y) {
    if (x == null) { const side = K.randi(0, 3); x = side === 0 ? -20 : side === 1 ? K.W + 20 : K.rand(0, K.W); y = side === 2 ? -20 : side === 3 ? K.H + 20 : K.rand(0, K.H); }
    const T = TYPES[k]; foes.push({ k, x, y, hp: T.hp + Math.floor(wave / 6), vx: 0, vy: 0, t: K.rand(0, 100), rot: 0 });
  }
  function nextWave() { wave++; spawnLeft = 6 + wave * 3; waveT = 0; K.float(K.W / 2, K.H / 2 - 40, `Wave ${wave}`, '#5cffb0'); K.sfx.good(); }
  let mouseDown = false; const wasd = new Set();
  addEventListener('keydown', (e) => wasd.add(e.key.toLowerCase())); addEventListener('keyup', (e) => wasd.delete(e.key.toLowerCase())); addEventListener('blur', () => wasd.clear());
  K.onDown = (p, e) => { if (e.pointerType === 'mouse') mouseDown = true; mouse = p; };
  K.onUp = () => { mouseDown = false; };
  K.onMove = (p, e) => { if (e.pointerType === 'mouse') mouse = p; };
  function update() {
    // move
    let mv = { x: (wasd.has('d') ? 1 : 0) - (wasd.has('a') ? 1 : 0), y: (wasd.has('s') ? 1 : 0) - (wasd.has('w') ? 1 : 0) };
    if (K.pad.x || K.pad.y) mv = { x: K.pad.x, y: K.pad.y };
    if (K.stick.x || K.stick.y) mv = { x: K.stick.x, y: K.stick.y };
    const mm = Math.hypot(mv.x, mv.y); if (mm > 1) { mv.x /= mm; mv.y /= mm; }
    const sp = 3.4;
    me.x = K.clamp(me.x + mv.x * sp, 14, K.W - 14); me.y = K.clamp(me.y + mv.y * sp, 14, K.H - 14);
    // aim: stick > arrow keys > mouse
    let aim = K.aim(), shooting = false;
    const kx = (K.held('ArrowRight') ? 1 : 0) - (K.held('ArrowLeft') ? 1 : 0), ky = (K.held('ArrowDown') ? 1 : 0) - (K.held('ArrowUp') ? 1 : 0);
    if (aim && Math.hypot(aim.x, aim.y) > .3) { me.ang = Math.atan2(aim.y, aim.x); shooting = true; }
    else if (kx || ky) { me.ang = Math.atan2(ky, kx); shooting = true; }
    else if (mouse) { me.ang = Math.atan2(mouse.y - me.y, mouse.x - me.x); shooting = mouseDown || K.held(' '); }
    if (K.held(' ') && !mouse) shooting = true;
    me.cd--; power.rapid--; power.spread--;
    if (shooting && me.cd <= 0) {
      me.cd = power.rapid > 0 ? 4 : 8;
      const angs = power.spread > 0 ? [-.18, 0, .18] : [0];
      for (const da of angs) bullets.push({ x: me.x + Math.cos(me.ang) * 16, y: me.y + Math.sin(me.ang) * 16, vx: Math.cos(me.ang + da) * 11, vy: Math.sin(me.ang + da) * 11, t: 70 });
      K.tone(900, .03, 'square', .02, 500);
    }
    // waves
    if (!spawnLeft && !foes.length) { if (++waveT > 90) nextWave(); }
    if (spawnLeft > 0 && K.t % Math.max(10, 34 - wave * 2) === 0) {
      spawnLeft--; const r = Math.random();
      spawn(wave > 4 && r < .15 ? 'shooter' : wave > 2 && r < .35 ? 'splitter' : wave > 1 && r < .6 ? 'dasher' : 'chaser');
    }
    for (const b of bullets) { b.x += b.vx; b.y += b.vy; b.t--; }
    for (const f of foes) {
      const T = TYPES[f.k], dx = me.x - f.x, dy = me.y - f.y, d = Math.hypot(dx, dy) || 1; f.t++; f.rot += .03;
      if (f.k === 'dasher') { if (f.t % 120 < 30) { f.vx *= .9; f.vy *= .9; } else if (f.t % 120 === 30) { f.vx = dx / d * 7; f.vy = dy / d * 7; } else { f.vx *= .97; f.vy *= .97; } }
      else if (f.k === 'shooter') { const want = d > 260 ? 1 : d < 200 ? -1 : 0; f.vx = dx / d * T.sp * want; f.vy = dy / d * T.sp * want; if (f.t % 100 === 0) ebul.push({ x: f.x, y: f.y, vx: dx / d * 4, vy: dy / d * 4, t: 200 }); }
      else { f.vx = K.lerp(f.vx, dx / d * T.sp * (1 + wave * .03), .1); f.vy = K.lerp(f.vy, dy / d * T.sp * (1 + wave * .03), .1); }
      f.x += f.vx; f.y += f.vy;
      for (const b of bullets) if (b.t > 0 && Math.hypot(b.x - f.x, b.y - f.y) < T.r + 4) { b.t = 0; f.hp--; K.burst(b.x, b.y, T.col, 3, 2); if (f.hp <= 0) kill(f); break; }
      if (me.inv <= 0 && d < T.r + 10 && f.hp > 0) hurt();
    }
    for (const b of ebul) { b.x += b.vx; b.y += b.vy; b.t--; if (me.inv <= 0 && Math.hypot(b.x - me.x, b.y - me.y) < 12) { b.t = 0; hurt(); } }
    for (const d of drops) { d.t--; if (Math.hypot(d.x - me.x, d.y - me.y) < 22) { d.t = 0; if (d.k === 'heal') me.hp = Math.min(5, me.hp + 1); else power[d.k] = 600; K.sfx.good(); K.float(d.x, d.y, d.k === 'heal' ? '+1 life' : d.k === 'rapid' ? 'Rapid fire!' : 'Spread shot!', '#5cffb0'); } }
    foes = foes.filter((f) => f.hp > 0); bullets = bullets.filter((b) => b.t > 0 && b.x > -20 && b.x < K.W + 20 && b.y > -20 && b.y < K.H + 20); ebul = ebul.filter((b) => b.t > 0); drops = drops.filter((d) => d.t > 0);
    me.inv--; if (--comboT <= 0) combo = 1;
  }
  function kill(f) {
    const T = TYPES[f.k]; score += T.pts * combo; combo = Math.min(8, combo + .25); comboT = 120;
    K.burst(f.x, f.y, T.col, 16, 4); K.tone(200 + Math.random() * 200, .08, 'square', .04, 60);
    if (f.k === 'splitter') for (let i = 0; i < 3; i++) spawn('mini', f.x + K.rand(-10, 10), f.y + K.rand(-10, 10));
    if (Math.random() < .06) drops.push({ x: f.x, y: f.y, k: K.pick(['heal', 'rapid', 'spread']), t: 600 });
  }
  function hurt() {
    me.hp--; me.inv = 90; K.sfx.hit(); K.shake(10); K.burst(me.x, me.y, '#fff', 20, 5);
    foes.forEach((f) => { if (Math.hypot(f.x - me.x, f.y - me.y) < 90) { f.hp = 0; K.burst(f.x, f.y, TYPES[f.k].col, 10, 3); } });
    if (me.hp <= 0) { K.sfx.boom(); K.over({ score: Math.floor(score), text: `You lasted until wave ${wave}.`, again: start }); }
  }
  function poly(x, y, r, n, rot, col) { c.strokeStyle = col; c.lineWidth = 3; c.beginPath(); for (let i = 0; i <= n; i++) { const a = rot + i * Math.PI * 2 / n; c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } c.stroke(); }
  function draw() {
    K.begin('#07070f');
    c.strokeStyle = '#ffffff08'; c.lineWidth = 1;
    for (let x = 0; x < K.W; x += 40) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, K.H); c.stroke(); }
    for (let y = 0; y < K.H; y += 40) { c.beginPath(); c.moveTo(0, y); c.lineTo(K.W, y); c.stroke(); }
    c.strokeStyle = '#5cffb044'; c.lineWidth = 3; c.strokeRect(2, 2, K.W - 4, K.H - 4);
    for (const d of drops) { if (d.t < 120 && d.t % 10 < 5) continue; K.circle(d.x, d.y, 12, '#0a2a1c'); poly(d.x, d.y, 12, 6, 0, '#5cffb0'); K.text(d.k === 'heal' ? '+' : d.k === 'rapid' ? 'R' : 'S', d.x, d.y + 1, { size: 13, weight: 900, color: '#5cffb0', align: 'center' }); }
    c.shadowBlur = 12;
    for (const f of foes) { const T = TYPES[f.k]; c.shadowColor = T.col; poly(f.x, f.y, T.r, T.sides, f.rot, T.col); if (f.k === 'dasher' && f.t % 120 < 30) poly(f.x, f.y, T.r + 5, 4, f.rot, T.col + '66'); }
    c.shadowColor = '#fff'; for (const b of bullets) K.circle(b.x, b.y, 3, '#eafff5');
    c.shadowColor = '#4dc3ff'; for (const b of ebul) K.circle(b.x, b.y, 5, '#4dc3ff');
    c.shadowBlur = 0;
    if (!(me.inv > 0 && me.inv % 10 < 5)) { c.save(); c.translate(me.x, me.y); c.rotate(me.ang); c.shadowColor = '#5cffb0'; c.shadowBlur = 16; c.fillStyle = '#5cffb0'; c.beginPath(); c.moveTo(16, 0); c.lineTo(-10, 11); c.lineTo(-5, 0); c.lineTo(-10, -11); c.fill(); c.restore(); c.shadowBlur = 0; }
    K.drawParts();
    K.text(Math.floor(score).toLocaleString(), 16, 26, { size: 24, weight: 900 });
    K.text(`Wave ${wave}  ·  ×${combo.toFixed(1)}`, 16, 52, { size: 14, color: '#5cffb0' });
    K.text('♥'.repeat(Math.max(0, me.hp)), 16, 76, { size: 18, color: '#ff5c8a' });
    if (power.rapid > 0) K.text('RAPID', 16, 100, { size: 12, color: '#5cffb0', weight: 900 });
    if (power.spread > 0) K.text('SPREAD', 70, 100, { size: 12, color: '#5cffb0', weight: 900 });
    K.end();
  }
  function start() { reset(); K.play(); }
  reset();
  K.touch({ stick: true, aim: true });
  K.screen({ title: 'Hex Arena', text: 'Twin-stick survival. Move with one hand, shoot with the other, and survive as many waves of geometric enemies as you can.', best: true,
    lines: ['Move: WASD (left stick)', 'Shoot: arrow keys, or aim with the mouse and hold the button (right stick)', 'Kill fast to build a score multiplier', 'Getting hit clears enemies near you'], buttons: [{ label: 'Play', act: start }] });
  K.run(update, draw);
})();
</script>
</body>
</html>
