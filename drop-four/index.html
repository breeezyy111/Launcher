<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drop Four</title>
<style>
  [hidden] { display:none !important; }
  :root { --bg:#eef3ff; --panel:#ffffff; --board:#2747c9; --hole:#eef3ff; --text:#18203a; --muted:#66708f; --p1:#ff4f6d; --p2:#ffc93c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1122; --panel:#161c33; --board:#2a44b8; --hole:#0d1122; --text:#e8ecfa; --muted:#8e97b8; } }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html,body { min-height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; gap:14px; padding:16px 12px calc(16px + env(safe-area-inset-bottom)); user-select:none; }
  header, .bar { width:min(560px,100%); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  h1 { font-size:22px; letter-spacing:-.02em; margin-right:auto; }
  .score { display:flex; gap:10px; font-weight:700; font-variant-numeric:tabular-nums; }
  .score span { display:inline-flex; align-items:center; gap:6px; }
  .dot { width:14px; height:14px; border-radius:50%; display:inline-block; }
  button, select { font:inherit; font-weight:600; border:0; border-radius:10px; background:var(--panel); color:var(--text); min-height:40px; padding:0 14px; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  button:focus-visible, select:focus-visible { outline:2px solid var(--board); outline-offset:2px; }
  .spacer { flex:1; }
  #status { width:min(560px,100%); font-weight:700; font-size:18px; display:flex; align-items:center; gap:10px; min-height:28px; }
  #wrap { position:relative; width:min(560px,100%); }
  #board { position:relative; display:grid; grid-template-columns:repeat(7,1fr); gap:clamp(4px,1.4vw,10px); padding:clamp(6px,1.8vw,14px); background:var(--board); border-radius:20px; box-shadow:0 16px 40px -16px #2747c9aa, inset 0 -6px 0 rgba(0,0,0,.18); cursor:pointer; touch-action:manipulation; }
  .h { aspect-ratio:1; border-radius:50%; background:var(--hole); box-shadow:inset 0 4px 6px rgba(0,0,0,.25); position:relative; overflow:hidden; }
  .disc { position:absolute; inset:0; border-radius:50%; box-shadow:inset 0 -5px 0 rgba(0,0,0,.18), inset 0 4px 0 rgba(255,255,255,.3); }
  .disc.p1 { background:var(--p1); } .disc.p2 { background:var(--p2); }
  .disc.drop { animation:drop var(--d) cubic-bezier(.5,0,1,1); }
  @keyframes drop { from { transform:translateY(var(--from)); } }
  .disc.win { animation:pulse .8s ease-in-out infinite alternate; box-shadow:0 0 0 4px #fff inset; }
  @keyframes pulse { to { filter:brightness(1.3); } }
  .col-hint { position:absolute; top:-26px; width:calc(100% / 7); display:grid; place-items:center; pointer-events:none; transition:left .12s; }
  .col-hint i { width:22px; height:22px; border-radius:50%; opacity:.8; }
  .help { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Drop Four</h1>
  <div class="score"><span><i class="dot" style="background:var(--p1)"></i><b id="s1">0</b></span><span><i class="dot" style="background:var(--p2)"></i><b id="s2">0</b></span></div>
</header>
<div class="bar">
  <select id="mode" aria-label="Opponent">
    <option value="easy">vs CPU · Easy</option>
    <option value="medium" selected>vs CPU · Medium</option>
    <option value="hard">vs CPU · Hard</option>
    <option value="2p">2 players</option>
  </select>
  <span class="spacer"></span>
  <button id="undo">Undo</button>
  <button id="new">New game</button>
</div>
<div id="status"></div>
<div id="wrap" style="margin-top:22px"><div class="col-hint" id="hint"><i></i></div><div id="board" role="grid" aria-label="Board"></div></div>
<p class="help">Line up four in a row: across, down or diagonal. Tap a column, or use ←/→ and Enter (keys 1–7 also work).</p>
<script>
(() => {
  const R = 6, C = 7, $ = (id) => document.getElementById(id);
  const KEY = 'drop-four:';
  let grid, turn, over, moves, hover = 3, busy = false;
  let wins = JSON.parse(localStorage.getItem(KEY + 'wins') || '[0,0]');
  $('mode').value = localStorage.getItem(KEY + 'mode') || 'medium';
  const holes = [];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) { const h = document.createElement('div'); h.className = 'h'; h.dataset.c = c; $('board').append(h); holes.push(h); }
  const hole = (r, c) => holes[r * C + c];

  function newGame() {
    grid = [...Array(R)].map(() => Array(C).fill(0)); turn = 1; over = false; moves = []; busy = false;
    holes.forEach((h) => h.replaceChildren());
    status(); maybeCpu();
  }
  const vsCpu = () => $('mode').value !== '2p';
  function status(msg) {
    const col = turn === 1 ? 'var(--p1)' : 'var(--p2)';
    const who = vsCpu() ? (turn === 1 ? 'Your turn' : 'CPU is thinking…') : `Player ${turn}’s turn`;
    $('status').innerHTML = `<i class="dot" style="background:${col}"></i>`;
    $('status').append(msg || who);
    $('hint').querySelector('i').style.background = col;
    $('hint').style.visibility = over || busy ? 'hidden' : 'visible';
    $('s1').textContent = wins[0]; $('s2').textContent = wins[1];
  }
  const lowest = (g, c) => { for (let r = R - 1; r >= 0; r--) if (!g[r][c]) return r; return -1; };

  function play(c) {
    if (over || busy) return;
    const r = lowest(grid, c); if (r < 0) return;
    grid[r][c] = turn; moves.push([r, c]);
    const d = document.createElement('div');
    d.className = `disc p${turn} drop`;
    d.style.setProperty('--from', `-${(r + 1) * 115}%`);
    d.style.setProperty('--d', `${.18 + r * .05}s`);
    hole(r, c).append(d);
    navigator.vibrate?.(10);
    const line = winLine(grid, r, c);
    if (line) {
      over = true; wins[turn - 1]++; localStorage.setItem(KEY + 'wins', JSON.stringify(wins));
      setTimeout(() => line.forEach(([rr, cc]) => hole(rr, cc).firstChild.classList.add('win')), 350);
      status(vsCpu() ? (turn === 1 ? 'You win!' : 'CPU wins this one.') : `Player ${turn} wins!`);
      return;
    }
    if (moves.length === R * C) { over = true; status('It’s a draw.'); return; }
    turn = 3 - turn; status(); maybeCpu();
  }

  function winLine(g, r, c) {
    const p = g[r][c];
    for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      const line = [[r, c]];
      for (const s of [1, -1]) { let rr = r + dr * s, cc = c + dc * s; while (rr >= 0 && rr < R && cc >= 0 && cc < C && g[rr][cc] === p) { line.push([rr, cc]); rr += dr * s; cc += dc * s; } }
      if (line.length >= 4) return line;
    }
    return null;
  }

  // ---- CPU: alpha-beta search with a window-count score ----
  function scoreWindow(w, p) {
    const mine = w.filter((v) => v === p).length, theirs = w.filter((v) => v === 3 - p).length, empty = 4 - mine - theirs;
    if (mine === 4) return 1000; if (mine === 3 && empty === 1) return 6; if (mine === 2 && empty === 2) return 2;
    if (theirs === 3 && empty === 1) return -5; return 0;
  }
  function evaluate(g, p) {
    let s = 0;
    for (let r = 0; r < R; r++) if (g[r][3] === p) s += 4;
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      const er = r + dr * 3, ec = c + dc * 3; if (er < 0 || er >= R || ec < 0 || ec >= C) continue;
      s += scoreWindow([0, 1, 2, 3].map((i) => g[r + dr * i][c + dc * i]), p);
    }
    return s;
  }
  const ORDER = [3, 2, 4, 1, 5, 0, 6];
  function search(g, depth, a, b, p, me) {
    let best = -Infinity, any = false;
    for (const c of ORDER) {
      const r = lowest(g, c); if (r < 0) continue; any = true;
      g[r][c] = p;
      let v;
      if (winLine(g, r, c)) v = 100000 + depth;
      else if (depth === 0) v = evaluate(g, p) - evaluate(g, 3 - p);
      else v = -search(g, depth - 1, -b, -a, 3 - p, me);
      g[r][c] = 0;
      if (v > best) best = v;
      if (best > a) a = best;
      if (a >= b) break;
    }
    return any ? best : 0;
  }
  function cpuMove() {
    const depth = { easy: 1, medium: 4, hard: 7 }[$('mode').value];
    if ($('mode').value === 'easy' && Math.random() < .35) { const ok = ORDER.filter((c) => lowest(grid, c) >= 0); return ok[Math.floor(Math.random() * ok.length)]; }
    let best = -Infinity, pick = 3;
    for (const c of ORDER) {
      const r = lowest(grid, c); if (r < 0) continue;
      grid[r][c] = 2;
      const v = winLine(grid, r, c) ? 1e6 : -search(grid, depth - 1, -Infinity, Infinity, 1, 2);
      grid[r][c] = 0;
      if (v > best) { best = v; pick = c; }
    }
    return pick;
  }
  function maybeCpu() {
    if (!vsCpu() || turn !== 2 || over) return;
    busy = true; status();
    setTimeout(() => { const c = cpuMove(); busy = false; play(c); }, 420);
  }

  function setHover(c) { hover = Math.max(0, Math.min(C - 1, c)); $('hint').style.left = `calc(${hover} * 100% / 7)`; }
  $('board').addEventListener('pointermove', (e) => { const c = e.target.closest('.h')?.dataset.c; if (c !== undefined) setHover(+c); });
  $('board').addEventListener('click', (e) => { const c = e.target.closest('.h')?.dataset.c; if (c !== undefined) { setHover(+c); play(+c); } });
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') setHover(hover - 1);
    else if (e.key === 'ArrowRight') setHover(hover + 1);
    else if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); over ? newGame() : play(hover); }
    else if (e.key >= '1' && e.key <= '7') { setHover(+e.key - 1); play(+e.key - 1); }
  });
  $('new').addEventListener('click', newGame);
  $('mode').addEventListener('change', () => { localStorage.setItem(KEY + 'mode', $('mode').value); newGame(); });
  $('undo').addEventListener('click', () => {
    if (busy || !moves.length) return;
    const n = vsCpu() ? (turn === 1 && !over ? 2 : moves.length % 2 === 1 ? 1 : 2) : 1;
    for (let i = 0; i < n && moves.length; i++) { const [r, c] = moves.pop(); grid[r][c] = 0; hole(r, c).replaceChildren(); }
    if (over) { over = false; }
    turn = moves.length % 2 === 0 ? 1 : 2; holes.forEach((h) => h.firstChild?.classList.remove('win')); status(); maybeCpu();
  });
  setHover(3); newGame();
})();
</script>
</body>
</html>
