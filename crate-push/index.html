<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crate Push</title>
</head>
<body>
<script src="../kit/kit.js"></script>
<script>
(() => {
  const K = window.K.init({ id: 'crate-push', W: 480, H: 740, bg: '#2b2118', accent: '#f2b84b' });
  const c = K.ctx, D = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  let W, H, walls, goals, crates, pl, level, moves, hist, won, face;
  const k = (x, y) => y * 100 + x;
  // Made backwards: start solved, then the worker *pulls* crates around at random.
  // Whatever it ends up with can always be pushed back, so every level is solvable.
  function gen(lv) {
    level = lv; const n = Math.min(5, 1 + Math.ceil(lv / 2)); W = Math.min(10, 6 + Math.floor(lv / 3)); H = W + 1;
    for (let attempt = 0; attempt < 300; attempt++) {
      const wl = new Set();
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (x === 0 || y === 0 || x === W - 1 || y === H - 1 || Math.random() < .13) wl.add(k(x, y));
      const open = []; for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) if (!wl.has(k(x, y))) open.push([x, y]);
      if (open.length < n + 8) continue;
      K.shuffle(open);
      const gs = open.slice(0, n), cs = new Set(gs.map(([x, y]) => k(x, y))); let [px, py] = open[n];
      // the open area must be one connected region
      const seen = new Set([k(px, py)]), q = [[px, py]]; while (q.length) { const [x, y] = q.pop(); for (const [dx, dy] of D) { const kk = k(x + dx, y + dy); if (!wl.has(kk) && !seen.has(kk)) { seen.add(kk); q.push([x + dx, y + dy]); } } }
      if (seen.size !== open.length) continue;
      const steps = 120 + lv * 40;
      for (let s = 0; s < steps; s++) {
        const [dx, dy] = K.pick(D), nx = px + dx, ny = py + dy;
        if (wl.has(k(nx, ny)) || cs.has(k(nx, ny))) continue;
        const bx = px - dx, by = py - dy;
        if (cs.has(k(bx, by)) && Math.random() < .8) { cs.delete(k(bx, by)); cs.add(k(px, py)); }
        px = nx; py = ny;
      }
      const goalSet = new Set(gs.map(([x, y]) => k(x, y)));
      const off = [...cs].filter((v) => !goalSet.has(v)).length;
      if (off < Math.min(n, 1 + Math.floor(lv / 2))) continue;
      walls = wl; goals = goalSet; crates = cs; pl = { x: px, y: py }; moves = 0; hist = []; won = false; face = 2;
      return;
    }
    gen(Math.max(1, lv - 1)); level = lv;
  }
  function step(d) {
    if (K.state !== 'play' || won) return; face = d;
    const [dx, dy] = D[d], nx = pl.x + dx, ny = pl.y + dy;
    if (walls.has(k(nx, ny))) return;
    let pushed = false;
    if (crates.has(k(nx, ny))) {
      const bx = nx + dx, by = ny + dy; if (walls.has(k(bx, by)) || crates.has(k(bx, by))) return;
      hist.push({ p: { ...pl }, c: new Set(crates) }); crates.delete(k(nx, ny)); crates.add(k(bx, by)); pushed = true;
      K.tone(goals.has(k(bx, by)) ? 700 : 220, .06, 'square', .05);
    } else hist.push({ p: { ...pl }, c: new Set(crates) });
    pl.x = nx; pl.y = ny; moves++;
    if (!pushed) K.tone(160, .02, 'square', .02);
    if ([...crates].every((v) => goals.has(v))) { won = true; K.sfx.win(); K.store.set('crate-push:level', level + 1); K.submit(level); setTimeout(() => K.screen({ title: 'Stacked!', big: `Level ${level}`, text: `${moves} moves`, buttons: [{ label: 'Next level', act: () => { gen(level + 1); K.play(); } }] }), 600); }
  }
  function undo() { const h = hist.pop(); if (!h) return; pl = h.p; crates = new Set(h.c); moves++; K.sfx.blip(); }
  function restart() { if (hist.length) { pl = hist[0].p; crates = new Set(hist[0].c); hist = []; moves = 0; } }
  K.onKey = (key) => { if (K.state !== 'play') return; if (key === 'u' || key === 'U' || key === 'z' || key === 'Z' || key === 'Backspace') undo(); if (key === 'r' || key === 'R') restart(); };
  let held = 0, sw = null;
  function update() {
    const a = K.axis(); const d = a.y < -.5 ? 0 : a.x > .5 ? 1 : a.y > .5 ? 2 : a.x < -.5 ? 3 : -1;
    if (d >= 0) { if (held === 0 || (held > 12 && held % 5 === 0)) step(d); held++; } else held = 0;
    if (K.pressed('b')) undo();
  }
  const geo = () => { const S = Math.floor(Math.min((K.W - 20) / W, 520 / H)); return { S, ox: (K.W - S * W) / 2, oy: 100 }; };
  K.onDown = (p) => {
    if (K.state !== 'play') return; const { S, oy } = geo(), by = oy + H * S + 20;
    if (p.y > by && p.y < by + 52) { if (p.x < K.W / 2) undo(); else restart(); return; }
    sw = p;
  };
  K.onUp = (p) => {
    if (!sw) return; const dx = p.x - sw.x, dy = p.y - sw.y; sw = null;
    if (Math.hypot(dx, dy) > 20) return step(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
    const { S, ox, oy } = geo(), tx = (p.x - ox) / S - pl.x - .5, ty = (p.y - oy) / S - pl.y - .5;
    if (Math.hypot(tx, ty) < .5) return; step(Math.abs(tx) > Math.abs(ty) ? (tx > 0 ? 1 : 3) : (ty > 0 ? 2 : 0));
  };
  function draw() {
    K.begin('#2b2118');
    const { S, ox, oy } = geo();
    K.text(`Level ${level}`, 16, 34, { size: 26, weight: 900, color: '#f2b84b' });
    K.text(`${moves} moves · ${[...crates].filter((v) => goals.has(v)).length}/${goals.size} on spots`, 16, 64, { size: 15, color: '#c9b79c' });
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const px = ox + x * S, py = oy + y * S;
      if (walls.has(k(x, y))) { c.fillStyle = '#5a4430'; c.fillRect(px, py, S, S); c.fillStyle = '#6e543b'; c.fillRect(px + 2, py + 2, S / 2 - 3, S / 2 - 3); c.fillRect(px + S / 2 + 1, py + S / 2 + 1, S / 2 - 3, S / 2 - 3); }
      else { c.fillStyle = (x + y) % 2 ? '#d8c6a5' : '#cfbb98'; c.fillRect(px, py, S, S); }
      if (goals.has(k(x, y))) { c.strokeStyle = '#d9534f'; c.lineWidth = 3; c.beginPath(); c.arc(px + S / 2, py + S / 2, S * .22, 0, 7); c.stroke(); K.circle(px + S / 2, py + S / 2, S * .08, '#d9534f'); }
    }
    for (const v of crates) {
      const x = v % 100, y = Math.floor(v / 100), px = ox + x * S + 3, py = oy + y * S + 3, s = S - 6, on = goals.has(v);
      c.fillStyle = on ? '#e2a13b' : '#b8742f'; c.fillRect(px, py, s, s); c.strokeStyle = on ? '#fff3c4' : '#7a4a1c'; c.lineWidth = 3; c.strokeRect(px + 2, py + 2, s - 4, s - 4);
      c.beginPath(); c.moveTo(px + 4, py + 4); c.lineTo(px + s - 4, py + s - 4); c.moveTo(px + s - 4, py + 4); c.lineTo(px + 4, py + s - 4); c.stroke();
    }
    // worker
    const cx = ox + pl.x * S + S / 2, cy = oy + pl.y * S + S / 2;
    K.circle(cx, cy + S * .08, S * .32, '#2f6fb5'); K.circle(cx, cy - S * .14, S * .2, '#f5cba7');
    c.fillStyle = '#f2b84b'; c.beginPath(); c.arc(cx, cy - S * .2, S * .21, Math.PI, 0); c.fill();
    const [fx, fy] = D[face]; K.circle(cx + fx * S * .08 - S * .06, cy - S * .14 + fy * S * .05, S * .03, '#222'); K.circle(cx + fx * S * .08 + S * .06, cy - S * .14 + fy * S * .05, S * .03, '#222');
    const by = oy + H * S + 20;
    c.fillStyle = '#4a3828'; K.rr(16, by, K.W / 2 - 24, 52, 12); c.fill(); K.rr(K.W / 2 + 8, by, K.W / 2 - 24, 52, 12); c.fill();
    K.text('↶ Undo (U)', K.W / 4 + 4, by + 26, { size: 16, align: 'center' }); K.text('⟲ Restart (R)', K.W * .75 - 4, by + 26, { size: 16, align: 'center' });
    K.text(K.isTouch ? 'Swipe or tap next to the worker to walk' : 'Arrows / WASD to walk and push', K.W / 2, by + 80, { size: 13, color: '#c9b79c', align: 'center' });
    K.end();
  }
  K.fmtBest = (n) => 'Level ' + n;
  const saved = K.store.get('crate-push:level', 1);
  gen(saved);
  K.screen({ title: 'Crate Push', text: 'Push every crate onto a red spot. You can push but never pull, so think before you shove one into a corner.', best: true,
    lines: ['Walk with arrows, WASD, swipes or taps', 'Undo as much as you like', 'Every level is generated and always solvable'],
    buttons: [{ label: saved > 1 ? `Continue level ${saved}` : 'Play', act: () => K.play() }, ...(saved > 1 ? [{ label: 'Start at level 1', alt: true, act: () => { gen(1); K.play(); } }] : [])] });
  K.run(update, draw);
})();
</script>
</body>
</html>
