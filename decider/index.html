<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decider</title>
<style>
  [hidden] { display:none !important; }
  :root { --bg:#fff8ec; --panel:#ffffff; --text:#2a1f12; --muted:#8c7a63; --line:#f0e3cc; --accent:#ff7a1a; --a2:#ffb547; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17120c; --panel:#221b13; --text:#f7eee2; --muted:#ad9b83; --line:#3a2f22; } }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html,body { min-height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  body { display:flex; justify-content:center; padding:16px 12px calc(24px + env(safe-area-inset-bottom)); }
  main { width:min(520px,100%); display:flex; flex-direction:column; gap:16px; }
  .tabs { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; padding:4px; background:var(--line); border-radius:14px; }
  .tabs button { border:0; border-radius:10px; min-height:44px; background:none; color:var(--muted); font:inherit; font-weight:700; font-size:14px; cursor:pointer; }
  .tabs button[aria-selected=true] { background:var(--panel); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  section { display:flex; flex-direction:column; align-items:center; gap:18px; padding-top:8px; }
  .big { min-height:56px; padding:0 34px; border:0; border-radius:16px; background:linear-gradient(135deg,var(--accent),var(--a2)); color:#fff; font:inherit; font-weight:800; font-size:18px; cursor:pointer; box-shadow:0 10px 24px -10px var(--accent); }
  .big:active { transform:scale(.97); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .result { font-size:28px; font-weight:800; min-height:40px; text-align:center; }
  .sub { color:var(--muted); font-size:14px; text-align:center; }
  /* coin */
  .coin { width:180px; height:180px; position:relative; transform-style:preserve-3d; }
  .coin.spin { animation:flip 1.2s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes flip { from { transform:rotateY(0) translateY(0); } 40% { transform:rotateY(calc(var(--turns) * .45)) translateY(-60px); } to { transform:rotateY(var(--turns)) translateY(0); } }
  .face { position:absolute; inset:0; border-radius:50%; display:grid; place-items:center; backface-visibility:hidden; font-size:22px; font-weight:900; letter-spacing:.06em; color:#7a4a00; background:radial-gradient(circle at 35% 30%, #ffe9a8, #f4b63f 60%, #c98a1a); box-shadow:inset 0 0 0 8px #e7a530, inset 0 0 0 10px #ffd979; }
  .face.tails { transform:rotateY(180deg); background:radial-gradient(circle at 35% 30%, #fff3c8, #e6c262 60%, #b8912b); }
  /* dice */
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  select, input[type=number] { min-height:42px; border:1px solid var(--line); border-radius:12px; background:var(--panel); color:var(--text); font:inherit; padding:0 10px; }
  input[type=number] { width:100px; }
  .dice { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; min-height:90px; }
  .die { width:76px; height:76px; border-radius:18px; background:var(--panel); box-shadow:0 6px 16px -8px rgba(0,0,0,.35), inset 0 -4px 0 var(--line); display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr); padding:12px; }
  .die span { display:grid; place-items:center; }
  .die i { display:block; width:12px; height:12px; border-radius:50%; background:var(--text); }
  .die.num { display:grid; place-items:center; font-size:30px; font-weight:900; color:var(--accent); grid-template:none; }
  .die.roll { animation:roll .5s ease-out; }
  @keyframes roll { 0% { transform:rotate(-200deg) scale(.5); } 70% { transform:rotate(10deg) scale(1.05); } }
  /* wheel */
  .wheelwrap { position:relative; width:min(340px,86vw); aspect-ratio:1; }
  #wheelSvg { width:100%; height:100%; display:block; }
  .pointer { position:absolute; top:-6px; left:50%; translate:-50% 0; width:0; height:0; border:14px solid transparent; border-top:26px solid var(--text); filter:drop-shadow(0 2px 2px rgba(0,0,0,.3)); z-index:2; }
  textarea { width:100%; min-height:110px; border:1px solid var(--line); border-radius:14px; background:var(--panel); color:var(--text); font:inherit; padding:10px 12px; resize:vertical; }
  label.ck { display:flex; gap:8px; align-items:center; color:var(--muted); font-size:14px; }
  .teams { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; width:100%; }
  .team { background:var(--panel); border-radius:14px; padding:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .team h3 { font-size:14px; margin-bottom:6px; color:var(--accent); }
  .team li { list-style:none; padding:3px 0; }
  .hist { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .hist span { background:var(--panel); border-radius:999px; padding:3px 10px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="tabs" role="tablist">
    <button role="tab" data-t="coin">Coin</button><button role="tab" data-t="dice">Dice</button><button role="tab" data-t="wheel">Wheel</button><button role="tab" data-t="num">Number</button><button role="tab" data-t="teams">Teams</button>
  </div>

  <section id="coin">
    <div class="coin" id="coinEl"><div class="face">HEADS</div><div class="face tails">TAILS</div></div>
    <div class="result" id="coinRes" aria-live="polite"></div>
    <button class="big" id="flip">Flip</button>
    <div class="sub" id="coinTally"></div>
  </section>

  <section id="dice" hidden>
    <div class="row">
      <select id="dn" aria-label="How many dice"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
      <select id="ds" aria-label="Sides"><option value="4">d4</option><option value="6" selected>d6</option><option value="8">d8</option><option value="10">d10</option><option value="12">d12</option><option value="20">d20</option><option value="100">d100</option></select>
    </div>
    <div class="dice" id="diceEl"></div>
    <div class="result" id="diceRes" aria-live="polite"></div>
    <button class="big" id="roll">Roll</button>
    <div class="hist" id="diceHist"></div>
  </section>

  <section id="wheel" hidden>
    <div class="wheelwrap"><div class="pointer"></div><svg id="wheelSvg" viewBox="-110 -110 220 220"><g id="wheelG"></g></svg></div>
    <div class="result" id="wheelRes" aria-live="polite"></div>
    <button class="big" id="spin">Spin</button>
    <textarea id="opts" aria-label="Wheel options, one per line"></textarea>
    <label class="ck"><input type="checkbox" id="remove"> Remove the winner after each spin</label>
  </section>

  <section id="num" hidden>
    <div class="row"><span>From</span><input type="number" id="nmin" value="1" aria-label="Lowest"><span>to</span><input type="number" id="nmax" value="100" aria-label="Highest"></div>
    <div class="result" id="numRes" style="font-size:72px;min-height:90px" aria-live="polite">?</div>
    <button class="big" id="pick">Pick a number</button>
    <div class="hist" id="numHist"></div>
  </section>

  <section id="teams" hidden>
    <textarea id="names" aria-label="Names, one per line" placeholder="One name per line"></textarea>
    <div class="row"><span>Split into</span><select id="tn" aria-label="Number of teams"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select><span>teams</span></div>
    <button class="big" id="split">Make teams</button>
    <div class="teams" id="teamsEl"></div>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id), KEY = 'decider:';
  const rnd = (n) => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
  const buzz = (ms = 15) => navigator.vibrate?.(ms);

  // tabs
  const tabs = document.querySelectorAll('[data-t]');
  function tab(t) { tabs.forEach((b) => b.setAttribute('aria-selected', String(b.dataset.t === t))); for (const b of tabs) $(b.dataset.t).hidden = b.dataset.t !== t; localStorage.setItem(KEY + 'tab', t); }
  tabs.forEach((b) => b.addEventListener('click', () => tab(b.dataset.t)));
  tab(localStorage.getItem(KEY + 'tab') || 'coin');

  // coin
  let rot = 0, tally = [0, 0];
  $('flip').onclick = () => {
    const heads = rnd(2) === 0;
    rot += 360 * 5 + (heads ? (rot % 360 === 0 ? 0 : 180) : (rot % 360 === 0 ? 180 : 0));
    const el = $('coinEl'); el.classList.remove('spin'); void el.offsetWidth;
    el.style.setProperty('--turns', rot + 'deg'); el.style.transform = `rotateY(${rot}deg)`; el.classList.add('spin');
    $('coinRes').textContent = '';
    setTimeout(() => { $('coinRes').textContent = heads ? 'Heads' : 'Tails'; tally[heads ? 0 : 1]++; $('coinTally').textContent = `Heads ${tally[0]} · Tails ${tally[1]}`; buzz(); }, 1150);
  };

  // dice
  const PIPS = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
  function die(v, sides) {
    const d = document.createElement('div'); d.className = 'die roll';
    if (sides === 6) { for (let i = 1; i <= 9; i++) { const c = document.createElement('span'); if (PIPS[v].includes(i)) c.append(document.createElement('i')); d.append(c); } }
    else { d.classList.add('num'); d.textContent = v; }
    return d;
  }
  const dHist = [];
  $('roll').onclick = () => {
    const n = +$('dn').value, s = +$('ds').value, vals = [...Array(n)].map(() => rnd(s) + 1);
    $('diceEl').replaceChildren(...vals.map((v) => die(v, s)));
    const sum = vals.reduce((a, b) => a + b, 0);
    $('diceRes').textContent = n > 1 ? `Total ${sum}` : '';
    dHist.unshift(`${n}d${s}: ${sum}`); dHist.length = Math.min(dHist.length, 8);
    $('diceHist').replaceChildren(...dHist.map((h) => Object.assign(document.createElement('span'), { textContent: h })));
    buzz(25);
  };
  $('diceEl').replaceChildren(die(3, 6), die(5, 6));

  // wheel
  const COLS = ['#ff7a1a', '#ffb547', '#2fbf71', '#2e86ff', '#8b5cf6', '#ff4fa3', '#14b8a6', '#e5484d'];
  $('opts').value = localStorage.getItem(KEY + 'opts') || 'Pizza\nTacos\nSushi\nBurgers\nPasta\nSalad';
  const opts = () => $('opts').value.split('\n').map((s) => s.trim()).filter(Boolean).slice(0, 40);
  let wheelRot = 0, spinning = false;
  function drawWheel() {
    const o = opts(), g = $('wheelG'); g.replaceChildren();
    const NS = 'http://www.w3.org/2000/svg', n = Math.max(o.length, 1);
    o.forEach((label, i) => {
      const a0 = (i / n) * Math.PI * 2 - Math.PI / 2, a1 = ((i + 1) / n) * Math.PI * 2 - Math.PI / 2;
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', n === 1 ? 'M0-100A100 100 0 1 1 0 100A100 100 0 1 1 0-100z' : `M0 0L${Math.cos(a0) * 100} ${Math.sin(a0) * 100}A100 100 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${Math.cos(a1) * 100} ${Math.sin(a1) * 100}z`);
      p.setAttribute('fill', COLS[i % COLS.length]); p.setAttribute('stroke', '#fff'); p.setAttribute('stroke-width', '1.5');
      const t = document.createElementNS(NS, 'text'), mid = (a0 + a1) / 2;
      t.setAttribute('transform', `rotate(${mid * 180 / Math.PI}) translate(92 0)`);
      t.setAttribute('text-anchor', 'end'); t.setAttribute('dominant-baseline', 'middle'); t.setAttribute('fill', '#fff');
      t.setAttribute('font-size', n > 16 ? 7 : n > 10 ? 9 : 11); t.setAttribute('font-weight', '700'); t.setAttribute('font-family', 'system-ui');
      t.textContent = label.length > 16 ? label.slice(0, 15) + '…' : label;
      g.append(p, t);
    });
    const hub = document.createElementNS(NS, 'circle'); hub.setAttribute('r', 12); hub.setAttribute('fill', '#fff'); g.append(hub);
  }
  $('opts').addEventListener('input', () => { localStorage.setItem(KEY + 'opts', $('opts').value); drawWheel(); });
  $('spin').onclick = () => {
    const o = opts(); if (spinning || o.length < 2) { if (o.length < 2) $('wheelRes').textContent = 'Add at least two options'; return; }
    spinning = true; $('wheelRes').textContent = '';
    const win = rnd(o.length), seg = 360 / o.length;
    // Land the middle-ish of the winner's slice under the pointer at the top.
    const target = 360 - (win * seg + seg * (.2 + Math.random() * .6));
    wheelRot += 360 * 6 + ((target - (wheelRot % 360)) + 360) % 360;
    const g = $('wheelSvg'); g.style.transition = 'transform 4s cubic-bezier(.12,.75,.15,1)'; g.style.transform = `rotate(${wheelRot}deg)`;
    setTimeout(() => {
      spinning = false; $('wheelRes').textContent = `🎉 ${o[win]}`; buzz([20, 40, 20]);
      if ($('remove').checked) { const rest = o.filter((_, i) => i !== win); setTimeout(() => { $('opts').value = rest.join('\n'); localStorage.setItem(KEY + 'opts', $('opts').value); g.style.transition = 'none'; g.style.transform = 'rotate(0)'; wheelRot = 0; drawWheel(); }, 1200); }
    }, 4050);
  };
  drawWheel();

  // number
  const nHist = [];
  $('pick').onclick = () => {
    let a = Math.round(+$('nmin').value), b = Math.round(+$('nmax').value); if (a > b) [a, b] = [b, a];
    const v = a + rnd(b - a + 1); let k = 0;
    const iv = setInterval(() => { $('numRes').textContent = a + rnd(b - a + 1); if (++k > 12) { clearInterval(iv); $('numRes').textContent = v; nHist.unshift(v); nHist.length = Math.min(nHist.length, 10); $('numHist').replaceChildren(...nHist.map((h) => Object.assign(document.createElement('span'), { textContent: h }))); buzz(); } }, 50);
  };

  // teams
  $('names').value = localStorage.getItem(KEY + 'names') || '';
  $('names').addEventListener('input', () => localStorage.setItem(KEY + 'names', $('names').value));
  $('split').onclick = () => {
    const names = $('names').value.split('\n').map((s) => s.trim()).filter(Boolean);
    const n = +$('tn').value;
    if (names.length < n) { $('teamsEl').textContent = `Add at least ${n} names.`; return; }
    for (let i = names.length - 1; i > 0; i--) { const j = rnd(i + 1); [names[i], names[j]] = [names[j], names[i]]; }
    const teams = [...Array(n)].map(() => []); names.forEach((nm, i) => teams[i % n].push(nm));
    $('teamsEl').replaceChildren(...teams.map((t, i) => { const d = document.createElement('div'); d.className = 'team'; const h = document.createElement('h3'); h.textContent = `Team ${i + 1}`; const ul = document.createElement('ul'); ul.append(...t.map((nm) => Object.assign(document.createElement('li'), { textContent: nm }))); d.append(h, ul); return d; }));
    buzz();
  };

  addEventListener('keydown', (e) => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); const cur = [...tabs].find((b) => b.getAttribute('aria-selected') === 'true').dataset.t; ({ coin: $('flip'), dice: $('roll'), wheel: $('spin'), num: $('pick'), teams: $('split') })[cur].click(); }
  });
})();
</script>
</body>
</html>
