<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calc</title>
<style>
  [hidden] { display:none !important; }
  :root { --bg:#f2f4f7; --panel:#ffffff; --key:#ffffff; --key2:#e7eaf0; --op:#ff8a3d; --op-text:#fff; --text:#141821; --muted:#6b7385; --accent:#ff8a3d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1015; --panel:#171a21; --key:#20242d; --key2:#2c313c; --text:#eef0f5; --muted:#8f97a8; } }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html,body { min-height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  body { display:flex; justify-content:center; padding:16px 12px calc(16px + env(safe-area-inset-bottom)); }
  main { width:min(420px,100%); display:flex; flex-direction:column; gap:12px; }
  .tabs { display:flex; gap:4px; padding:4px; background:var(--key2); border-radius:12px; }
  .tabs button { flex:1; min-height:38px; border:0; border-radius:9px; background:transparent; font:inherit; font-weight:700; color:var(--muted); cursor:pointer; }
  .tabs button[aria-selected=true] { background:var(--panel); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .screen { background:var(--panel); border-radius:18px; padding:14px 18px; min-height:132px; display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-end; gap:4px; box-shadow:0 1px 3px rgba(0,0,0,.06); overflow:hidden; }
  #hist { color:var(--muted); font-size:14px; display:flex; flex-direction:column; align-items:flex-end; gap:2px; max-height:64px; overflow:hidden; }
  #hist button { border:0; background:none; color:inherit; font:inherit; cursor:pointer; padding:0; }
  #expr { font-size:20px; color:var(--muted); word-break:break-all; text-align:right; min-height:26px; }
  #out { font-size:clamp(36px,11vw,52px); font-weight:300; letter-spacing:-.02em; font-variant-numeric:tabular-nums; word-break:break-all; text-align:right; line-height:1.1; }
  #out.err { color:#e5484d; font-size:24px; }
  .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .keys button { min-height:clamp(58px,14vw,68px); border:0; border-radius:18px; background:var(--key); color:var(--text); font:inherit; font-size:24px; font-weight:500; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.08); transition:transform .08s, filter .1s; }
  .keys button:active, .keys button.press { transform:scale(.94); filter:brightness(.92); }
  .keys .fn { background:var(--key2); font-size:20px; }
  .keys .op { background:var(--op); color:var(--op-text); font-size:28px; }
  .keys .eq { background:var(--text); color:var(--bg); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  /* converter */
  .conv { display:flex; flex-direction:column; gap:10px; }
  .kinds { display:flex; flex-wrap:wrap; gap:6px; }
  .kinds button { border:0; border-radius:999px; padding:0 14px; min-height:36px; background:var(--key); color:var(--text); font:inherit; font-weight:600; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .kinds button[aria-pressed=true] { background:var(--accent); color:#fff; }
  .field { background:var(--panel); border-radius:16px; padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
  .field input { border:0; background:transparent; color:var(--text); font:inherit; font-size:34px; font-weight:300; width:100%; outline:none; font-variant-numeric:tabular-nums; }
  .field select { border:0; background:var(--key2); color:var(--text); font:inherit; font-weight:600; border-radius:10px; padding:8px 10px; }
  .swap { align-self:center; width:44px; height:44px; border-radius:50%; border:0; background:var(--key2); color:var(--text); font-size:20px; cursor:pointer; }
  .all { background:var(--panel); border-radius:16px; padding:6px 14px; }
  .all div { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--key2); font-variant-numeric:tabular-nums; }
  .all div:last-child { border:0; }
  .all span { color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="calc">Calculator</button>
    <button role="tab" aria-selected="false" data-tab="conv">Converter</button>
  </div>
  <section id="calc">
    <div class="screen">
      <div id="hist"></div>
      <div id="expr"></div>
      <div id="out">0</div>
    </div>
    <div class="keys" id="keys" style="margin-top:12px"></div>
  </section>
  <section id="conv" class="conv" hidden>
    <div class="kinds" id="kinds"></div>
    <div class="field"><input id="cin" inputmode="decimal" value="1" aria-label="Value"><select id="cfrom" aria-label="From unit"></select></div>
    <button class="swap" id="swap" aria-label="Swap units">⇅</button>
    <div class="field"><input id="cout" readonly aria-label="Result" tabindex="-1"><select id="cto" aria-label="To unit"></select></div>
    <div class="all" id="all"></div>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  // ---------- calculator ----------
  // A tiny parser (no eval): + − × ÷ ^ %, brackets, √ and unary minus.
  function calc(src) {
    const s = src.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
    let i = 0;
    const peek = () => s[i], eat = (c) => (s[i] === c ? (i++, true) : false);
    function expr() { let v = term(); for (;;) { if (eat('+')) v += term(); else if (eat('-')) v -= term(); else return v; } }
    function term() { let v = power(); for (;;) { if (eat('*')) v *= power(); else if (eat('/')) { const d = power(); if (d === 0) throw Error('Can’t divide by zero'); v /= d; } else return v; } }
    function power() { const b = unary(); if (eat('^')) return Math.pow(b, power()); return b; }
    function unary() { if (eat('-')) return -unary(); if (eat('+')) return unary(); if (eat('√')) return Math.sqrt(unary()); return postfix(); }
    function postfix() { let v = atom(); while (eat('%')) v /= 100; return v; }
    function atom() {
      if (eat('(')) { const v = expr(); eat(')'); return v; }
      const m = s.slice(i).match(/^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i);
      if (m) { i += m[0].length; return parseFloat(m[0]); }
      if (s.startsWith('π', i)) { i++; return Math.PI; }
      throw Error('Check the sum');
    }
    if (!s.trim()) return 0;
    const v = expr();
    if (i < s.length) throw Error('Check the sum');
    if (!isFinite(v)) throw Error('Too big');
    return v;
  }
  const fmt = (v) => {
    if (Math.abs(v) >= 1e15 || (Math.abs(v) < 1e-9 && v !== 0)) return v.toExponential(6).replace(/\.?0+e/, 'e');
    return (+v.toPrecision(12)).toLocaleString(undefined, { maximumFractionDigits: 10 });
  };
  let expr = '', justDone = false;
  const hist = JSON.parse(localStorage.getItem('calc:hist') || '[]');
  const KEYS = [['C', 'fn'], ['( )', 'fn'], ['%', 'fn'], ['÷', 'op'], ['7'], ['8'], ['9'], ['×', 'op'], ['4'], ['5'], ['6'], ['−', 'op'], ['1'], ['2'], ['3'], ['+', 'op'], ['√', 'fn'], ['0'], ['.'], ['=', 'op eq']];
  for (const [k, cls] of KEYS) {
    const b = document.createElement('button'); b.textContent = k; b.className = cls || ''; b.dataset.k = k;
    b.addEventListener('click', () => press(k)); $('keys').append(b);
  }
  function press(k) {
    const ops = '+−×÷^';
    if (k === 'C') { if (expr === '' ) hist.length = 0; expr = ''; justDone = false; return show(); }
    if (k === '⌫') { expr = expr.slice(0, -1); return show(); }
    if (k === '=') {
      try { const v = calc(expr); hist.unshift([expr, fmt(v)]); hist.length = Math.min(hist.length, 20); localStorage.setItem('calc:hist', JSON.stringify(hist)); expr = String(+v.toPrecision(12)); justDone = true; $('expr').textContent = hist[0][0] + ' ='; renderHist(); $('out').classList.remove('err'); $('out').textContent = fmt(v); }
      catch (e) { $('out').textContent = e.message; $('out').classList.add('err'); }
      return;
    }
    if (k === '( )') { const open = (expr.match(/\(/g) || []).length - (expr.match(/\)/g) || []).length; k = open > 0 && /[\d)%π]$/.test(expr) ? ')' : '('; }
    if (justDone && /[\d.√(π]/.test(k)) expr = '';
    justDone = false;
    if (ops.includes(k) && ops.includes(expr.slice(-1))) expr = expr.slice(0, -1);
    if (ops.includes(k) && expr === '' && k !== '−') expr = '0';
    expr += k;
    show();
  }
  function show() {
    $('expr').textContent = expr;
    $('out').classList.remove('err');
    try { $('out').textContent = fmt(calc(expr.replace(/[+−×÷^(√]+$/, ''))); } catch { /* keep last */ }
    $('keys').querySelector('[data-k="C"]').textContent = expr ? 'C' : 'AC';
    renderHist();
  }
  function renderHist() {
    $('hist').replaceChildren(...hist.slice(0, 3).reverse().map(([e, v]) => { const b = document.createElement('button'); b.textContent = `${e} = ${v}`; b.title = 'Use this result'; b.onclick = () => { expr = v.replace(/,/g, ''); justDone = true; show(); }; return b; }));
  }
  addEventListener('keydown', (e) => {
    if ($('calc').hidden || e.target.tagName === 'INPUT') return;
    const map = { '*': '×', '/': '÷', '-': '−', 'Enter': '=', '=': '=', 'Backspace': '⌫', 'Escape': 'C', 'Delete': 'C' };
    let k = map[e.key] || e.key;
    if (/^[\d.+%^()]$/.test(k) || ['×', '÷', '−', '=', '⌫', 'C'].includes(k)) {
      e.preventDefault();
      if (k === '(' || k === ')') { expr += k; justDone = false; show(); } else press(k);
      const btn = $('keys').querySelector(`[data-k="${CSS.escape(k === 'C' ? 'C' : k)}"]`);
      if (btn) { btn.classList.add('press'); setTimeout(() => btn.classList.remove('press'), 100); }
    }
  });
  show();

  // ---------- converter ----------
  // Each unit is a factor to the base unit (temperature uses functions).
  const UNITS = {
    Length: { m: 1, km: 1000, cm: .01, mm: .001, mi: 1609.344, yd: .9144, ft: .3048, in: .0254 },
    Weight: { kg: 1, g: .001, mg: 1e-6, lb: .45359237, oz: .028349523125, st: 6.35029318, t: 1000 },
    Temperature: { '°C': [(v) => v, (v) => v], '°F': [(v) => (v - 32) * 5 / 9, (v) => v * 9 / 5 + 32], K: [(v) => v - 273.15, (v) => v + 273.15] },
    Speed: { 'km/h': 1 / 3.6, mph: .44704, 'm/s': 1, knot: .514444 },
    Area: { 'm²': 1, 'km²': 1e6, 'ft²': .09290304, acre: 4046.8564224, hectare: 1e4 },
    Volume: { L: 1, mL: .001, 'gal (US)': 3.785411784, 'cup (US)': .2365882365, 'fl oz (US)': .0295735295625, 'm³': 1000 },
    Time: { s: 1, min: 60, h: 3600, day: 86400, week: 604800, year: 31557600 },
    Data: { B: 1, KB: 1e3, MB: 1e6, GB: 1e9, TB: 1e12, KiB: 1024, MiB: 1048576, GiB: 1073741824 },
  };
  let kind = localStorage.getItem('calc:kind') || 'Length';
  function setKind(k) {
    kind = k; localStorage.setItem('calc:kind', k);
    [...$('kinds').children].forEach((b) => b.setAttribute('aria-pressed', String(b.textContent === k)));
    const names = Object.keys(UNITS[k]);
    for (const [sel, idx] of [[$('cfrom'), 0], [$('cto'), 1]]) sel.replaceChildren(...names.map((n) => Object.assign(document.createElement('option'), { value: n, textContent: n })));
    $('cfrom').value = names[0]; $('cto').value = names[k === 'Temperature' ? 1 : Math.min(4, names.length - 1)];
    convert();
  }
  const toBase = (u, v) => { const f = UNITS[kind][u]; return Array.isArray(f) ? f[0](v) : v * f; };
  const fromBase = (u, v) => { const f = UNITS[kind][u]; return Array.isArray(f) ? f[1](v) : v / f; };
  function convert() {
    let v; try { v = calc($('cin').value || '0'); } catch { $('cout').value = '…'; return; }
    const base = toBase($('cfrom').value, v);
    $('cout').value = fmt(fromBase($('cto').value, base));
    $('all').replaceChildren(...Object.keys(UNITS[kind]).filter((u) => u !== $('cfrom').value).map((u) => {
      const d = document.createElement('div'); d.innerHTML = `<span></span><b></b>`; d.firstChild.textContent = u; d.lastChild.textContent = fmt(fromBase(u, base)); return d;
    }));
  }
  for (const k of Object.keys(UNITS)) { const b = document.createElement('button'); b.textContent = k; b.onclick = () => setKind(k); $('kinds').append(b); }
  $('cin').addEventListener('input', convert); $('cfrom').addEventListener('change', convert); $('cto').addEventListener('change', convert);
  $('swap').addEventListener('click', () => { const a = $('cfrom').value; $('cfrom').value = $('cto').value; $('cto').value = a; convert(); });
  setKind(UNITS[kind] ? kind : 'Length');

  document.querySelectorAll('[data-tab]').forEach((t) => t.addEventListener('click', () => {
    document.querySelectorAll('[data-tab]').forEach((x) => x.setAttribute('aria-selected', String(x === t)));
    $('calc').hidden = t.dataset.tab !== 'calc'; $('conv').hidden = t.dataset.tab !== 'conv';
  }));
})();
</script>
</body>
</html>
